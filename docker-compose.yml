# ==============================================================
# Proyecto Paradigmas — versión 3
#
#                                  ┌→ PostgreSQL (:15432) — bdfacturas
#   API FACTURAS (FastAPI, :8002) ─┤     el interruptor DB_PROVIDER
#                                  └→ MariaDB   (:13332) — bdfacturas
#
# Uso:  docker compose up -d --build      (un solo comando)
#   La API habla con PostgreSQL por defecto; para cambiar de motor
#   SIN tocar código:  $env:DB_PROVIDER="mariadb"
#                      docker compose up -d api-facturas
# Este archivo CRECE con las versiones: v4 suma SQL Server,
# v5 la API genérica, v6 el front.
# ==============================================================
services:

  # --- Base de datos: PostgreSQL 16 con bdfacturas completa ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bdfacturas_postgres_local
      POSTGRES_USER: paradigmas
      POSTGRES_PASSWORD: paradigmas123
    volumes:
      - pgdata:/var/lib/postgresql/data                          # los datos sobreviven a down/reinicios
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro    # se ejecuta solo con volumen vacío
    ports:
      - "15432:5432"     # puerto en su PC (para DBeaver/pgAdmin opcional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paradigmas -d bdfacturas_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MariaDB 11 — el SEGUNDO motor (v3): la misma bdfacturas ---
  # También se inicializa solo: el script montado corre la PRIMERA vez
  # (volumen vacío) — mismas semillas y mismos ids que PostgreSQL.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: paradigmas123
    volumes:
      - mariadbdata:/var/lib/mysql                                        # los datos sobreviven a down
      - ./db/init_mariadb.sql:/docker-entrypoint-initdb.d/init_mariadb.sql:ro
    ports:
      - "13332:3306"     # puerto en su PC (para HeidiSQL/DBeaver opcional)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- API Facturas (v1: producto · v2: +5 entidades · v3: bi-motor) ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app        # el código se monta: guardar un .py recarga solo
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    restart: unless-stopped
    ports:
      - "8002:8002"                # http://localhost:8002/docs
    environment:
      # Entre contenedores se usa el NOMBRE del servicio (postgres), no localhost
      DB_POSTGRES: postgresql+asyncpg://paradigmas:paradigmas123@postgres:5432/bdfacturas_postgres_local
      # v3 — la cadena del SEGUNDO motor:
      DB_MARIADB: mysql+aiomysql://root:paradigmas123@mariadb:3306/bdfacturas_mariadb_local
      # v3 — EL INTERRUPTOR: a qué motor le habla la API. Lee la variable
      # DB_PROVIDER de su terminal; si no existe, postgres. Cambiar de
      # motor = recrear SOLO este contenedor (segundos):
      #   $env:DB_PROVIDER="mariadb"; docker compose up -d api-facturas
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
    depends_on:
      postgres:
        condition: service_healthy   # arranca cuando la BD RESPONDE, no cuando existe
      mariadb:
        condition: service_healthy   # ...y cuando el motor nuevo también responde

volumes:
  pgdata:
  mariadbdata:      # v3: la "memoria" del segundo motor
